<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/input.css" />
    <script type="module" src="./src/js/script.js" defer></script>
    <title>Gasolineras</title>
  </head>
  <body class="bg-gradient-to-r from-green-100 via-gray-100 to-green-100 text-gray-800 font-sans min-h-screen flex flex-col items-center p-6">
    <h1 class="text-center text-3xl font-bold text-green-700 mb-6 w-full">
      🚗 Gas Stations
    </h1>

    <div class="main-container flex flex-col md:flex-row justify-between w-full max-w-6xl gap-6">

      <section id="filters" class="bg-white rounded-xl shadow-xl p-6 w-full md:w-1/3 sticky top-6">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2 border-gray-200">
          Filter Gas Stations
        </h2>
        <form id="filterForm" class="space-y-5">
          <div>
            <label for="province" class="block font-medium text-gray-700 mb-2">
              Province
            </label>
            <select
              id="province"
              name="province"
              class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 "
            >
              <option value="" disabled selected>Select a province</option>
            </select>
          </div>

          <div>
            <label for="municipality" class="block font-medium text-gray-700 mb-2">
              Municipality
            </label>
            <select
              id="municipality"
              name="municipality"
              disabled
              class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring focus:ring-green-300"
            >
              <option value="" disabled selected>Select a municipality</option>
            </select>
          </div>

          <div>
            <label for="fuelType" class="block font-medium text-gray-700 mb-2">
              Fuel Type
            </label>
            <select
              id="fuelType"
              name="fuelType"
              class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring focus:ring-green-300"
            >
              <option value="" disabled selected>Select a fuel type</option>
              <option value="Gasolina 95 E5">Gasolina 95 E5</option>
              <option value="Gasolina 98 E5">Gasolina 98 E5</option>
              <option value="Gasoleo A">Gasóleo A</option>
              <option value="Gasoleo A Premium">Gasóleo A Premium</option>
            </select>
          </div>

          <div>
            <label for="isOpen" class="flex items-center text-gray-700 font-medium">
              <input
                type="checkbox"
                id="isOpen"
                name="isOpen"
                class="mr-3 h-5 w-5 text-green-600 focus:ring-green-500"
              />
              Show only open stations
            </label>
          </div>
        </form>
      </section>

      <section id="results" class="bg-white rounded-xl shadow-xl p-6 w-full md:w-2/3 overflow-y-auto max-h-[80vh]">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2 border-gray-200">
          Gas Station Results
        </h2>
        <div id="stationList" class="space-y-6 text-gray-800">
          <p class="text-center text-gray-500 italic">No stations found 🚫</p>
        </div>
      </section>
    </div>
  </body>
</html>
